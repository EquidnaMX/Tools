[pytest]
# Configuración de pytest para download_do_space

# Directorio de tests
testpaths = tests

# Patrones de descubrimiento
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marcadores personalizados
markers =
    slow: tests que toman mucho tiempo en ejecutarse
    integration: tests de integración que requieren acceso a S3
    unit: tests unitarios puros

# Coverage
[coverage:run]
source = .
omit = 
    tests/*
    *_v*.py
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
